<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprite Generator & Animator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="panel generation-panel">
      <h2>Sprite Generator</h2>
      <div class="input-group">
        <label for="sprite-prompt">Describe your character:</label>
        <textarea id="sprite-prompt" rows="3" placeholder="e.g., A cute cat wizard with a pointy hat and wand"></textarea>
      </div>
      <button id="generate-btn">Generate Sprite</button>
      <div id="sprite-result" class="hidden">
        <h3>Generated Sprite</h3>
        <div id="sprite-image-container"></div>
        <div id="loading-message" class="hidden">Analyzing sprite for animation...</div>
        <button id="use-sprite-btn" class="hidden">Use This Sprite</button>
      </div>
    </div>
    
    <div class="panel game-panel hidden" id="game-panel">
      <h2>Game Scene</h2>
      <div id="game-container">
        <canvas id="game-canvas"></canvas>
      </div>
      <div class="controls">
        <p>Use WASD or arrow keys to move</p>
        <button id="new-sprite-btn">Create New Sprite</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"
      }
    }
  </script>
  <script src="script.js" type="module"></script>

</body>
</html>
